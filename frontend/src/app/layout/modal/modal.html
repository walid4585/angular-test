@if (visible()) {

<div class="modal-overlay">

    <div class="modal">

        <!-- Header -->

        <div class="modal-header">

            <h2>{{ title() }}</h2>

            <button
                class="close-btn"
                (click)="close()">

                ✕

            </button>

        </div>

        <!-- Body -->

        <div class="modal-body">

            <ng-content></ng-content>

        </div>

    </div>

</div>

}
