<!-- ============================================ -->
<!-- ====== Add Product Component ====== -->
<!-- ============================================ -->

<div class="card card--wide">
  
  <!-- ============================================ -->
  <!-- ====== Header ====== -->
  <!-- ============================================ -->
  <div class="card-header">
    <div class="header-left">
      <div>
        <h2>Add New Product</h2>
        <p class="subtitle">{{ activeMode === 'cloud' ? 'Cloud Products' : 'Local Products' }}</p>
      </div>
    </div>
    <div class="header-right">
     <div class="icon-wrapper">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </div>
    </div>
  </div>
 <div class="tabs">
        <button (click)="setMode('local')" [class.active]="activeMode === 'local'">💻 Local</button>
        <button (click)="setMode('cloud')" [class.active]="activeMode === 'cloud'">☁️ Cloud</button>
      </div>
  <!-- ============================================ -->
  <!-- ====== Alerts ====== -->
  <!-- ============================================ -->
  <div *ngIf="successMessage" class="alert success">
    <span class="alert-icon">✅</span>
    {{ successMessage }}
  </div>

  <div *ngIf="errorMessage" class="alert error">
    <span class="alert-icon">❌</span>
    {{ errorMessage }}
  </div>

  <!-- ============================================ -->
  <!-- ====== Form ====== -->
  <!-- ============================================ -->
  <form class="form-grid" [formGroup]="productForm" (ngSubmit)="onSubmit()" novalidate>
    <div class="form-group">
      <label for="title">Product Name</label>
      <input id="title" type="text" formControlName="title" placeholder="Enter product name" required />
    </div>

    <div class="form-group">
      <label for="edit-sizes">Sizes</label>
      <input id="edit-sizes" type="text" formControlName="sizesText" placeholder="S, M, L, XL" />
    </div>

    <div class="form-group">
      <label for="price">Price (DA)</label>
      <input id="price" type="number" formControlName="price" min="0" step="0.01" placeholder="Enter price" required />
    </div>

    <div class="form-group">
      <label for="stock">Stock Quantity</label>
      <input id="stock" type="number" formControlName="stock" min="0" step="1" placeholder="Enter stock" required />
    </div>

    <div class="form-group form-group--full">
      <label for="description">Description</label>
      <textarea id="description" formControlName="description" rows="4" placeholder="Product description..."></textarea>
    </div>

    <div class="form-group form-group--full">
      <label for="image">Product Image</label>
      <div class="file-upload-wrapper">
        <input
          id="image"
          #imageInput
          type="file"
          accept="image/*"
          (change)="onImageSelected($event)"
          class="file-input"
        />
        <div class="file-upload-area">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
          <span *ngIf="!selectedImageName">Click or drag to upload image</span>
          <span *ngIf="selectedImageName" class="file-name">{{ selectedImageName }}</span>
        </div>
      </div>
      <small class="hint">Supported formats: JPG, PNG, GIF</small>
    </div>

    <div class="form-actions form-actions--full">
      <button type="submit" class="btn btn-primary" [disabled]="productForm.invalid">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        Add Product
      </button>
      <button type="reset" class="btn btn-secondary" (click)="resetForm()">
        Reset
      </button>
    </div>
  </form>
</div>
